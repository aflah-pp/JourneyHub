backend:
  - changed-files:
      - any-glob-to-any-file:
          - "server/**"

frontend:
  - changed-files:
      - any-glob-to-any-file:
          - "frontend/**"

workflow:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/workflows/**"

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
          - "docs/**"

tests:
  - changed-files:
      - any-glob-to-any-file:
          - "**/tests/**"
          - "**/test_*.py"
          - "**/*.test.js"
          - "**/*.test.jsx"

github:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - "**/requirements*.txt"
          - "**/package.json"
          - "**/package-lock.json"

config:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.env.example"
          - "**/*.toml"
          - "**/*.yaml"
          - "**/*.yml"

security:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/workflows/semgrep.yml"
          - "server/**/middleware.py"
          - "server/**/permissions.py"
          - "server/**/authentication.py"

ui:
  - changed-files:
      - any-glob-to-any-file:
          - "frontend/src/components/**"
          - "frontend/src/pages/**"