name: Backend CI

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "server/**"

  pull_request:
    branches:
      - main
      - develop
    paths:
      - "server/**"

  workflow_dispatch:

jobs:
  backend:
    name: Lint, Validate & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: server

    env:
        SECRET_KEY: github-actions-secret-key
        DATABASE_URL: sqlite:///db.sqlite3
        FRONTEND_RESET_PASSWORD_URL: http://localhost:5173/reset-password

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff black

      - name: Environment Information
        run: |
          python --version
          python -m django --version
          pip freeze

      - name: Verify Django Startup
        run: |
          python - <<'EOF'
          import os
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "config.settings")

          import django

          print("Before django.setup()")
          django.setup()
          print("After django.setup()")
          EOF

      - name: Run Ruff
        run: ruff check .

      - name: Check Black Formatting
        run: black --check .

      - name: Django System Check
        run: python manage.py check --verbosity 3

      - name: Check Missing Migrations
        run: python manage.py makemigrations --check --dry-run --verbosity 3

      - name: Run Unit Tests
        run: python manage.py test --verbosity 2
